name: homepage

services:
  homepage:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: homepage
    ports:
      - "${HOMEPAGE_PORT:-8088}:8088"
    # The page reports on the host, not the container: share the host's process
    # table (the host's network stats are read through it, via /proc/1/net) and
    # mount the host filesystem read-only.
    pid: host
    environment:
      HOST_ROOT: /host
    volumes:
      - /:/host:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/udev:/run/udev:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/stats', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
